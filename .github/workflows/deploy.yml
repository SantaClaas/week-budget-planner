name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every action is pinned to a commit hash, with its version in a comment at the end of the line, so
# a moved tag can't change what runs. zizmor checks both the pin and that the hash is the version in
# the comment (see .github/zizmor.yml), and Dependabot or Renovate can update them together.

jobs:
  workflows:
    name: Lint the workflows
    runs-on: ubuntu-latest
    # Stops a job that hangs, instead of GitHub's six hours. It takes under a minute today.
    timeout-minutes: 10
    permissions:
      contents: read # Reads the repository to lint its workflows.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint 1.7.12
      - name: Run actionlint
        run: >
          docker run --rm --volume "$PWD:/repo" --workdir /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.31.1
          persona: pedantic
          advanced-security: false
          annotations: true
          config: .github/zizmor.yml

  check:
    name: Check
    runs-on: ubuntu-latest
    # Stops a job that hangs, instead of GitHub's six hours. It takes about two minutes today.
    timeout-minutes: 10
    permissions:
      contents: read # Reads the repository to check and build it.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          check-latest: true
          # A cache that a pull request could fill must not reach the build that gets deployed.
          cache: ${{ github.event_name == 'pull_request' && 'pnpm' || '' }}
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm knip
      - uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1
      - run: pnpm test
      - run: pnpm build
      # The browser tests run against the build above, in the Chromium this Playwright version expects,
      # headless: only its headless shell is installed, a smaller download than the full browser.
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm exec playwright test
        env:
          # Node's type stripping loads the tests instead of Playwright's own loader (see
          # Formatting and linting in docs/guidelines/typescript.md).
          PW_DISABLE_TS_ESM: "1"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: [workflows, check]
    runs-on: ubuntu-latest
    # Stops a job that hangs, instead of GitHub's six hours.
    timeout-minutes: 10
    permissions:
      pages: write # Publishes the build to GitHub Pages.
      id-token: write # Lets deploy-pages prove to Pages that the build comes from this workflow.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
