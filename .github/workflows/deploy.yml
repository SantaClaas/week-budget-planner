name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every action is pinned to a commit hash, with its version in the comment above, so a moved tag
# can't change what runs. zizmor checks the pinning (see .github/zizmor.yml).

jobs:
  workflows:
    name: Lint the workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read # Reads the repository to lint its workflows.
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          check-latest: true
          package-manager-cache: false
      - name: Check that every action is pinned with its version above it
        run: node scripts/check-action-pins.ts
      # actionlint 1.7.12
      - name: Run actionlint
        run: >
          docker run --rm --volume "$PWD:/repo" --workdir /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color
      # v0.7.1
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e
        with:
          version: 1.31.1
          persona: pedantic
          advanced-security: false
          annotations: true
          config: .github/zizmor.yml

  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read # Reads the repository to check and build it.
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v6.1.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      # v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          check-latest: true
          # A cache that a pull request could fill must not reach the build that gets deployed.
          cache: ${{ github.event_name == 'pull_request' && 'pnpm' || '' }}
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      # The browser tests run against the build above, in the Chromium this Playwright version expects.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
        env:
          # Node's type stripping loads the tests instead of Playwright's own loader (see
          # Formatting and linting in docs/CODING-GUIDELINES.md).
          PW_DISABLE_TS_ESM: "1"
      - if: failure()
        # v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
      - if: github.event_name != 'pull_request'
        # v6.0.0
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - if: github.event_name != 'pull_request'
        # v5.0.0
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: [workflows, check]
    runs-on: ubuntu-latest
    permissions:
      pages: write # Publishes the build to GitHub Pages.
      id-token: write # Lets deploy-pages prove to Pages that the build comes from this workflow.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        # v5.0.1
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
