# The Cargo workspace: every Rust crate, in crates/ (see docs/guidelines/rust.md). The app itself is
# built with pnpm and doesn't depend on any of this.
[workspace]
resolver = "3"
members = ["crates/server"]

[workspace.package]
edition = "2024"
rust-version = "1.100"
publish = false

# Exact versions, as pnpm saves them: the lockfile pins the rest (see The supply chain in
# docs/guidelines/rust.md).
[workspace.dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "ws"] }
futures-core = "=0.3.34"
futures-sink = "=0.3.34"
# The transport (see Transport in docs/spec/network.md): no port mapping, metrics or address lookup
# through n0's services, which the server doesn't use.
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
iroh-relay = { version = "=1.4.1", default-features = false, features = ["server", "tls-ring"] }
# The error type iroh-relay's WebSocket streams use.
n0-error = "=1.0.3"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower = { version = "=0.5.3", default-features = false, features = ["util"] }
tower-http = { version = "=0.7.1", default-features = false, features = ["fs", "trace"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = [
  "fmt",
  "json",
  "std",
] }

[workspace.lints.rust]
unsafe_code = "forbid"

# Cargo's own lints (Rust 1.100): a dependency no code uses fails, as knip does for npm.
[workspace.lints.cargo]
unused_dependencies = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Picked from restriction (see Lints and formatting in docs/guidelines/rust.md).
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
expect_used = "warn"
panic = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unwrap_used = "warn"

# Crate versions younger than registry.global-min-publish-age in .cargo/config.toml that may be in
# Cargo.lock anyway: one table per exact version, with why it's taken early, who agreed and when,
# and optionally the last day it holds, as "YYYY-MM-DD" strings. scripts/check-crate-age.ts requires
# them, and fails on an exception past its until or no longer needed (see The supply chain in
# docs/guidelines/rust.md). Cargo ignores [workspace.metadata]; the script is what reads it.
[[workspace.metadata.release-age.exclude]]
name = "url"
version = "2.5.9"
reason = "The fix for RUSTSEC-2026-0592, a stack overflow in Url::origin() on nested blob: URLs in 2.5.8, published on 2026-11-20."
approved-by = "SantaClaas"
approved-on = "2026-11-22"
until = "2026-11-27"

[[workspace.metadata.release-age.exclude]]
name = "form_urlencoded"
version = "1.2.3"
reason = "url 2.5.9 requires it; from the same repository (servo/rust-url), published a minute earlier."
approved-by = "SantaClaas"
approved-on = "2026-11-22"
until = "2026-11-27"
