# The Cargo workspace: every Rust crate, in crates/ (see docs/guidelines/rust.md). The app itself is
# built with pnpm and doesn't depend on any of this.
[workspace]
resolver = "3"
members = ["crates/server"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
publish = false

# Exact versions, as pnpm saves them: the lockfile pins the rest (see The supply chain in
# docs/guidelines/rust.md).
[workspace.dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
brotli = { version = "=9.1.1", default-features = false, features = ["std"] }
flate2 = { version = "=1.1.11", default-features = false, features = ["rust_backend"] }
http-body-util = "=0.1.5"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower = { version = "=0.5.3", default-features = false, features = ["util"] }
tower-http = { version = "=0.7.1", default-features = false, features = ["trace"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = [
  "fmt",
  "json",
  "std",
] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Picked from restriction (see Lints and formatting in docs/guidelines/rust.md).
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
expect_used = "warn"
panic = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unwrap_used = "warn"

# Crate versions younger than a week that may be in Cargo.lock anyway, each with its exact version
# and why (see The supply chain in docs/guidelines/rust.md). scripts/check-crate-age.ts reads it.
[workspace.metadata.release-age]
minimum-days = 7
exclude = []
