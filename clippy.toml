# In tests a panic is a failed test, so unwrap() and expect() are fine there (see Tests in
# docs/guidelines/rust.md).
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true

# manual_let_else would turn a match whose error branch ignores the error into
# `let Ok(value) = … else { return Err(…) };`, the form that throws the error away; a map_err is
# what such a match means (see Errors in docs/guidelines/rust.md). "Never" leaves matches alone, and
# question_mark still suggests `?` for an Option. Checked with Rust 1.100 on 2026-11-22.
matches-for-let-else = "Never"

# No binding named "kind": a value is named for what it means (see Names in docs/guidelines/rust.md,
# and Discriminated unions in docs/guidelines/typescript.md for the app's side). ".." keeps Clippy's
# own list (foo, baz, quux). It checks bindings, not fields; a field is left to review. Checked with
# Rust 1.100 on 2026-11-28.
disallowed-names = ["..", "kind"]
