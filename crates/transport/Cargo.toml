[package]
name = "week-budget-planner-transport"
description = "The browser's side of the transport: an iroh node in a WebAssembly module (see crates/transport/README.md)."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# cdylib for the WebAssembly module, rlib for the native tests and lints.
crate-type = ["cdylib", "rlib"]

[dependencies]
iroh.workspace = true
n0-future.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
getrandom.workspace = true

[dev-dependencies]
tokio.workspace = true

[lints]
workspace = true
