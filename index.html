<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="text-scale" content="scale" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Applies the theme setting before the first paint (see Design, Theme in docs/SPEC.md).
      // Kept tiny and blocking on purpose; src/theme.ts handles changes later.
      try {
        const theme = localStorage.getItem("week-budget-planner.theme");
        if (theme === "light" || theme === "dark") {
          document.querySelector('meta[name="color-scheme"]').content = theme;
        }
      } catch {
        // Storage can be blocked. The system setting applies then.
      }
    </script>
    <title>Week Budget Planner</title>
  </head>
  <body>
    <noscript>The Week Budget Planner needs JavaScript to plan your week.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
