<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="text-scale" content="scale" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Applies the stored Appearance settings before the first paint: the color scheme (Theme),
      // the contrast and the motion (see Theme, Contrast and Motion in docs/spec/design.md). Kept
      // tiny and blocking on purpose; src/color-scheme.ts handles changes later. Without a stored
      // choice, the browser's setting applies.
      try {
        const colorScheme = localStorage.getItem("week-budget-planner.color-scheme");
        if (colorScheme === "light" || colorScheme === "dark") {
          document.querySelector('meta[name="color-scheme"]').content = colorScheme;
        }
        const contrast = localStorage.getItem("week-budget-planner.contrast");
        if (contrast === "more" || contrast === "less" || contrast === "standard") {
          document.documentElement.dataset.contrast = contrast;
        }
        const motion = localStorage.getItem("week-budget-planner.motion");
        if (motion === "reduced" || motion === "full") {
          document.documentElement.dataset.motion = motion;
        }
      } catch {
        // Storage can be blocked. The system settings apply then.
      }
    </script>
    <title>Week Budget Planner</title>
    <link
      rel="preload"
      href="/src/font/google-sans-flex.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      // GitHub Pages can't send the cross-origin isolation headers the database needs, so the
      // service worker adds them. Register it and reload once when it takes control. The app never
      // waits for this: without isolation it starts with limited storage (see the spec).
      (() => {
        const flag = "week-budget-planner.isolation-reload";
        const storage = (() => {
          try {
            return window.sessionStorage;
          } catch {
            return undefined;
          }
        })();
        if (window.crossOriginIsolated) {
          storage?.removeItem(flag);
          return;
        }
        if (!window.isSecureContext || !("serviceWorker" in navigator)) return;
        const reloadOnce = () => {
          // The flag stops a reload loop when isolation still fails after the worker took over.
          if (storage?.getItem(flag) === "1") return;
          storage?.setItem(flag, "1");
          location.reload();
        };
        navigator.serviceWorker
          .register(new URL("sw.js", document.baseURI))
          .then(() => {
            if (navigator.serviceWorker.controller) reloadOnce();
            else navigator.serviceWorker.addEventListener("controllerchange", reloadOnce);
          })
          .catch((error) => console.warn("[isolation] service worker registration failed", error));
      })();
    </script>
  </head>
  <body>
    <noscript>The Week Budget Planner needs JavaScript to plan your week.</noscript>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
