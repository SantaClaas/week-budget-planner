<title>Week Budget Planner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: an hours ledger on the left that drains as tiles land on a ruled seven-day timetable on the right. One screen; each pane scrolls on its own. */
:root {
  --paper: oklch(0.962 0.007 235);
  --surface: oklch(0.992 0.003 235);
  --sunk: oklch(0.935 0.01 235);
  --weekend: oklch(0.972 0.006 235);
  --ink: oklch(0.25 0.035 258);
  --muted: oklch(0.47 0.025 252);
  --line: oklch(0.85 0.013 240);
  --line-soft: oklch(0.915 0.009 240);
  --accent: oklch(0.49 0.19 262);
  --accent-ink: oklch(0.99 0.01 262);
  --ok: oklch(0.5 0.13 155);
  --over: oklch(0.53 0.19 33);
  --tile-bg-l: 0.905; --tile-bg-c: 0.065;
  --tile-edge-l: 0.7; --tile-edge-c: 0.12;
  --tile-ink-l: 0.3; --tile-ink-c: 0.09;
  --solid-l: 0.6; --solid-c: 0.16;
  --lift: 0 1px 2px oklch(0.25 0.03 258 / 0.14), 0 8px 22px oklch(0.25 0.03 258 / 0.14);
  --font-display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --hour: 48px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: oklch(0.185 0.016 255);
    --surface: oklch(0.225 0.018 255);
    --sunk: oklch(0.27 0.02 255);
    --weekend: oklch(0.205 0.017 255);
    --ink: oklch(0.93 0.01 250);
    --muted: oklch(0.7 0.02 250);
    --line: oklch(0.35 0.022 255);
    --line-soft: oklch(0.285 0.02 255);
    --accent: oklch(0.74 0.13 262);
    --accent-ink: oklch(0.18 0.03 262);
    --ok: oklch(0.76 0.14 155);
    --over: oklch(0.74 0.15 40);
    --tile-bg-l: 0.34; --tile-bg-c: 0.07;
    --tile-edge-l: 0.52; --tile-edge-c: 0.11;
    --tile-ink-l: 0.94; --tile-ink-c: 0.045;
    --solid-l: 0.72; --solid-c: 0.15;
    --lift: 0 1px 2px oklch(0 0 0 / 0.5), 0 8px 22px oklch(0 0 0 / 0.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: oklch(0.185 0.016 255);
  --surface: oklch(0.225 0.018 255);
  --sunk: oklch(0.27 0.02 255);
  --weekend: oklch(0.205 0.017 255);
  --ink: oklch(0.93 0.01 250);
  --muted: oklch(0.7 0.02 250);
  --line: oklch(0.35 0.022 255);
  --line-soft: oklch(0.285 0.02 255);
  --accent: oklch(0.74 0.13 262);
  --accent-ink: oklch(0.18 0.03 262);
  --ok: oklch(0.76 0.14 155);
  --over: oklch(0.74 0.15 40);
  --tile-bg-l: 0.34; --tile-bg-c: 0.07;
  --tile-edge-l: 0.52; --tile-edge-c: 0.11;
  --tile-ink-l: 0.94; --tile-ink-c: 0.045;
  --solid-l: 0.72; --solid-c: 0.15;
  --lift: 0 1px 2px oklch(0 0 0 / 0.5), 0 8px 22px oklch(0 0 0 / 0.45);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.4;
}
h1, h2, p, ul, fieldset, legend { margin: 0; padding: 0; }
ul { list-style: none; }
fieldset { border: 0; min-width: 0; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  height: 100%;
  display: grid;
  grid-template-columns: 20.5rem minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr);
  gap: 12px 20px;
  padding-inline: 16px;
  padding-block: 12px 16px;
}
.top {
  grid-column: 1 / -1;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 4px 16px;
}
.brand {
  font-family: var(--font-display);
  font-stretch: 120%;
  font-weight: 800;
  font-size: 1.2rem;
  letter-spacing: -0.01em;
}
.status { font-family: var(--font-data); font-size: 0.72rem; color: var(--muted); min-height: 1em; }

/* ---------- buttons and fields ---------- */
.btn {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 5px;
  padding: 5px 10px;
  font-size: 0.8rem;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover:not(:disabled) { border-color: var(--accent); filter: brightness(1.08); }
.btn-quiet { background: transparent; border-color: transparent; color: var(--muted); }
.btn-quiet:hover:not(:disabled) { border-color: transparent; color: var(--ink); }
.btn-danger { color: var(--over); }
.fld { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.fld > span, .hues legend {
  font-size: 0.66rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--muted);
}
.fld input, .fld select, .range select {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 5px;
  padding: 5px 7px;
  min-width: 0;
  width: 100%;
  font-size: 0.85rem;
}
.fld input[type="number"] { font-family: var(--font-data); font-variant-numeric: tabular-nums; }

/* ---------- ledger (left) ---------- */
.ledger {
  min-height: 0;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding-right: 4px;
}
.ledger-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.eyebrow {
  font-family: var(--font-display);
  font-stretch: 112%;
  font-size: 0.7rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  color: var(--muted);
}
.ledger-count { font-family: var(--font-data); font-size: 0.7rem; color: var(--muted); }
.note {
  border: 1px dashed var(--line);
  border-radius: 6px;
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  font-size: 0.82rem;
}
.note-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.acts { display: flex; flex-direction: column; }
.act {
  border-top: 1px solid var(--line);
  padding-block: 8px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 4px 8px;
  align-items: center;
}
.act:last-child { border-bottom: 1px solid var(--line); }
.act-main {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  text-align: left;
  background: transparent;
  border: 0;
  border-radius: 6px;
  padding: 6px 8px;
  cursor: grab;
  user-select: none;
  -webkit-user-select: none;
}
.act-main:hover { background: var(--sunk); }
.act-main[aria-pressed="true"] {
  background: oklch(var(--tile-bg-l) var(--tile-bg-c) var(--h));
  box-shadow: inset 0 0 0 1.5px oklch(var(--tile-edge-l) var(--tile-edge-c) var(--h));
}
.act-swatch {
  width: 12px;
  height: 30px;
  border-radius: 3px;
  background: oklch(var(--solid-l) var(--solid-c) var(--h));
}
.act-text { display: flex; flex-direction: column; min-width: 0; }
.act-name { font-weight: 650; font-size: 0.92rem; overflow-wrap: anywhere; }
.act-sub { font-size: 0.75rem; color: var(--muted); }
.act-left { display: flex; flex-direction: column; align-items: flex-end; text-align: right; }
.act-fig { font-family: var(--font-data); font-weight: 500; font-size: 0.86rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.act-cap { font-size: 0.68rem; color: var(--muted); white-space: nowrap; }
.act.is-done .act-fig { color: var(--ok); }
.act.is-over .act-fig { color: var(--over); }
.meter {
  height: 6px;
  border-radius: 3px;
  background: var(--sunk);
  overflow: hidden;
  margin-left: 8px;
}
.meter-fill {
  display: block;
  height: 100%;
  width: 0;
  border-radius: 3px;
  background: oklch(var(--solid-l) var(--solid-c) var(--h));
  transition: width 0.18s ease-out;
}
.act.is-over .meter-fill { background: var(--over); }
.act-edit { padding: 2px 8px; font-size: 0.72rem; }
.empty { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 14px 8px; color: var(--muted); font-size: 0.85rem; }
.hint { font-size: 0.75rem; color: var(--muted); padding-inline: 8px; }

.act-form { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 9px; padding: 4px 8px; }
.fld-row { display: grid; grid-template-columns: 5rem minmax(0, 1fr) 4rem; gap: 8px; }
.hues { display: flex; flex-direction: column; gap: 4px; }
.hue-list { display: flex; flex-wrap: wrap; gap: 6px; }
.hue { position: relative; display: block; width: 22px; height: 22px; cursor: pointer; }
.hue input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.hue span {
  display: block;
  width: 100%;
  height: 100%;
  border-radius: 4px;
  background: oklch(var(--solid-l) var(--solid-c) var(--h));
}
.hue input:checked + span { box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--ink); }
.hue input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 4px; }
.form-err { color: var(--over); font-size: 0.78rem; }
.form-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.form-actions .btn-danger { margin-left: auto; }
.add { background: var(--sunk); border-radius: 8px; padding: 12px 6px 10px; display: flex; flex-direction: column; gap: 8px; }
.add .eyebrow { padding-inline: 8px; }

/* ---------- week (right) ---------- */
.week { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
.bar { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 8px 16px; }
.sum { flex: 1 1 16rem; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.sum-main { font-size: 0.86rem; color: var(--muted); }
.sum-fig {
  font-family: var(--font-display);
  font-stretch: 112%;
  font-weight: 750;
  font-size: 1.15rem;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.sum-left { color: var(--ink); font-weight: 600; }
.sum-left.is-done { color: var(--ok); }
.sum-left.is-over { color: var(--over); }
.meter-total { margin-left: 0; height: 4px; max-width: 26rem; }
.meter-total .meter-fill { background: var(--accent); }
.bar-tools { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
.range { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; color: var(--muted); margin-right: 6px; }
.range select { width: auto; font-family: var(--font-data); font-size: 0.76rem; padding: 4px 4px; }

.cal-scroll {
  flex: 1;
  min-height: 0;
  overflow: auto;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
}
.cal {
  display: grid;
  grid-template-columns: 3.25rem repeat(7, minmax(6rem, 1fr));
  min-width: 45.25rem;
  user-select: none;
  -webkit-user-select: none;
}
.corner, .dh {
  position: sticky;
  top: 0;
  z-index: 4;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  padding: 8px 8px 7px;
}
.corner { left: 0; z-index: 5; }
.dh { border-left: 1px solid var(--line); display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
.dh-name {
  font-family: var(--font-display);
  font-stretch: 112%;
  font-weight: 750;
  font-size: 0.74rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.dh.is-today .dh-name { color: var(--accent); }
.dh.is-today .dh-name::before {
  content: "";
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  margin-right: 5px;
  vertical-align: 1px;
}
.dh-sum { font-family: var(--font-data); font-size: 0.68rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.gutter { position: sticky; left: 0; z-index: 3; background: var(--surface); }
.gutter span {
  position: absolute;
  right: 6px;
  margin-top: 3px;
  font-family: var(--font-data);
  font-size: 0.68rem;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.day {
  position: relative;
  border-left: 1px solid var(--line);
  background-image:
    linear-gradient(to bottom, var(--line) 1px, transparent 1px),
    linear-gradient(to bottom, var(--line-soft) 1px, transparent 1px);
  background-size: 100% var(--hour), 100% calc(var(--hour) / 2);
}
.day.is-weekend { background-color: var(--weekend); }
body.is-armed .day { cursor: copy; }
.blocks { position: absolute; inset: 0; }

.block {
  position: absolute;
  z-index: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-radius: 4px;
  border: 1px solid oklch(var(--tile-edge-l) var(--tile-edge-c) var(--h));
  background: oklch(var(--tile-bg-l) var(--tile-bg-c) var(--h));
  color: oklch(var(--tile-ink-l) var(--tile-ink-c) var(--h));
  padding: 3px 6px;
  font-size: 0.76rem;
  line-height: 1.25;
  cursor: grab;
}
.block:hover { z-index: 2; }
.block.is-selected { z-index: 2; outline: 2px solid var(--accent); outline-offset: 1px; touch-action: none; }
.block.is-dragging { box-shadow: var(--lift); opacity: 0.94; }
.blk-name { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.blk-time { display: flex; flex-wrap: wrap; column-gap: 0.7em; font-family: var(--font-data); font-size: 0.66rem; font-variant-numeric: tabular-nums; }
.blk-time span { white-space: nowrap; }
.blk-dur { font-weight: 500; }
.block.is-short { padding-block: 0; justify-content: center; font-size: 0.66rem; line-height: 1; }
.block.is-short .blk-time { display: none; }
.rz { position: absolute; left: 0; right: 0; height: 7px; cursor: ns-resize; touch-action: none; }
.rz-top { top: 0; }
.rz-bot { bottom: 0; }
.rz::after {
  content: "";
  position: absolute;
  left: 50%;
  width: 18px;
  height: 2px;
  margin-left: -9px;
  border-radius: 1px;
  background: currentColor;
  opacity: 0;
}
.rz-top::after { top: 2px; }
.rz-bot::after { bottom: 2px; }
.block:hover .rz::after, .block.is-selected .rz::after { opacity: 0.55; }
.block.is-short .rz { height: 4px; }
.block.is-short .rz::after { display: none; }
.block.is-min .rz-top { display: none; }
.blk-x {
  position: absolute;
  top: 2px;
  right: 2px;
  width: 18px;
  height: 18px;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 0;
  border: 0;
  border-radius: 3px;
  background: oklch(var(--tile-ink-l) var(--tile-ink-c) var(--h));
  color: oklch(var(--tile-bg-l) var(--tile-bg-c) var(--h));
  font-size: 13px;
  line-height: 1;
  cursor: pointer;
}
.block:hover .blk-x, .block.is-selected .blk-x { display: flex; }
.block.is-short .blk-x { top: 0; right: 0; height: 100%; width: 16px; border-radius: 0; font-size: 10px; }
.preview {
  position: absolute;
  left: 2px;
  right: 2px;
  z-index: 2;
  border-radius: 4px;
  border: 1.5px dashed oklch(var(--solid-l) var(--solid-c) var(--h));
  background: oklch(var(--tile-bg-l) var(--tile-bg-c) var(--h) / 0.55);
  color: oklch(var(--tile-ink-l) var(--tile-ink-c) var(--h));
  font-family: var(--font-data);
  font-size: 0.66rem;
  padding: 2px 5px;
  overflow: hidden;
  white-space: nowrap;
  pointer-events: none;
}

body.is-dragging, body.is-dragging * { user-select: none !important; -webkit-user-select: none !important; }
body.drag-move, body.drag-move * { cursor: grabbing !important; }
body.drag-resize, body.drag-resize * { cursor: ns-resize !important; }

/* ---------- floating bits ---------- */
.chip {
  position: fixed;
  left: 0;
  top: 0;
  z-index: 30;
  pointer-events: none;
  border-radius: 4px;
  border: 1px solid oklch(var(--tile-edge-l) var(--tile-edge-c) var(--h));
  background: oklch(var(--tile-bg-l) var(--tile-bg-c) var(--h));
  color: oklch(var(--tile-ink-l) var(--tile-ink-c) var(--h));
  padding: 4px 8px;
  font-size: 0.76rem;
  font-weight: 700;
  box-shadow: var(--lift);
  white-space: nowrap;
}
.dock {
  position: fixed;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  z-index: 20;
  width: min(100% - 32px, 36rem);
  padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  pointer-events: none;
}
.pill {
  pointer-events: auto;
  max-width: 100%;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px 12px;
  background: var(--ink);
  color: var(--paper);
  border-radius: 8px;
  padding: 8px 10px 8px 14px;
  font-size: 0.82rem;
  box-shadow: var(--lift);
}
.pill-text { min-width: 0; overflow-wrap: anywhere; }
.pill-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.pill .btn { background: transparent; border-color: color-mix(in oklch, var(--paper) 40%, transparent); color: var(--paper); }
.pill .btn:hover { border-color: var(--paper); }
.pill-dot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; background: oklch(0.72 0.15 var(--h)); }

@media (max-width: 820px) {
  html, body { height: auto; }
  .app { display: flex; flex-direction: column; height: auto; gap: 16px; }
  .ledger { overflow: visible; padding-right: 0; }
  .cal-scroll { flex: none; max-height: 78vh; }
  .week { padding-bottom: 72px; }
}
@media (prefers-reduced-motion: reduce) {
  .meter-fill { transition: none; }
}
</style>

<div class="app">
  <header class="top">
    <h1 class="brand">Week Budget Planner</h1>
    <p class="status" id="status" aria-live="polite"></p>
  </header>

  <aside class="ledger" aria-label="Activities and their hours">
    <div class="note" id="example-note" hidden>
      <p><strong>Example week.</strong> These activities and tiles are placeholders. Edit them, or start with an empty week.</p>
      <div class="note-actions">
        <button type="button" class="btn" id="ex-clear">Start empty</button>
        <button type="button" class="btn btn-quiet" id="ex-keep">Keep these</button>
      </div>
    </div>
    <div class="ledger-head">
      <h2 class="eyebrow">Activities</h2>
      <span class="ledger-count" id="ledger-count"></span>
    </div>
    <ul class="acts" id="acts"></ul>
    <p class="hint" id="hint">Drag an activity onto the week. Or click it, then click a time slot.</p>
    <section class="add" aria-label="New activity">
      <h2 class="eyebrow">New activity</h2>
      <div id="add-slot"></div>
    </section>
  </aside>

  <main class="week">
    <div class="bar">
      <div class="sum">
        <p class="sum-main" id="sum-main"></p>
        <div class="meter meter-total" aria-hidden="true"><span class="meter-fill" id="sum-fill"></span></div>
      </div>
      <div class="bar-tools">
        <div class="range">
          <label for="day-start">Show</label>
          <select id="day-start" aria-label="First hour shown"></select>
          <label for="day-end">to</label>
          <select id="day-end" aria-label="Last hour shown"></select>
        </div>
        <button type="button" class="btn" id="undo" disabled>Undo</button>
        <button type="button" class="btn" id="clear" disabled>Clear week</button>
      </div>
    </div>
    <div class="cal-scroll" id="scroller">
      <div class="cal" id="cal"></div>
    </div>
  </main>
</div>

<div class="dock">
  <div class="pill" id="toast" role="status" hidden>
    <span class="pill-text" id="toast-text"></span>
    <span class="pill-actions"><button type="button" class="btn" id="toast-undo">Undo</button></span>
  </div>
  <div class="pill" id="armbar" hidden>
    <span class="pill-text"><span class="pill-dot" aria-hidden="true"></span>Placing <strong id="arm-name"></strong>, <span id="arm-dur"></span>. Click a time slot.</span>
    <span class="pill-actions">
      <button type="button" class="btn" id="arm-free">Use first free slot</button>
      <button type="button" class="btn" id="arm-done">Done</button>
    </span>
  </div>
</div>
<div class="chip" id="chip" hidden></div>

<script>
(() => {
  'use strict';

  const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  const DAYS_LONG = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
  const HUES = [
    [255, 'Blue'], [28, 'Red'], [152, 'Green'], [78, 'Amber'],
    [305, 'Violet'], [198, 'Teal'], [350, 'Pink'], [118, 'Lime'],
  ];
  const HOUR = 48;          // px per hour, mirrors --hour
  const SNAP = 15;          // minutes
  const LS_KEY = 'week-budget-planner.v1';

  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const el = (tag, cls) => { const n = document.createElement(tag); if (cls) n.className = cls; return n; };
  const uid = () => Math.random().toString(36).slice(2, 10);
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const snap = (m) => Math.round(m / SNAP) * SNAP;
  const floorSnap = (m) => Math.floor(m / SNAP) * SNAP;
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  // ---------- state ----------
  const blank = () => ({ activities: [], blocks: [], dayStart: 7, dayEnd: 22, example: false });
  let S = blank();
  let hist = [];
  let selectedId = null;
  let armedId = null;
  let editingId = null;
  let focusId = null;
  let drag = null;
  let suppressUntil = 0;
  let calRS = 7, calRE = 22;
  let dayEls = [];
  let preview = null;

  function int(v, lo, hi, dflt) {
    const n = Math.round(Number(v));
    return Number.isFinite(n) ? clamp(n, lo, hi) : dflt;
  }
  function sanitize(d) {
    const out = blank();
    if (!d || typeof d !== 'object') return out;
    const ids = new Set();
    for (const a of Array.isArray(d.activities) ? d.activities : []) {
      if (!a || typeof a !== 'object') continue;
      let id = String(a.id || uid()).slice(0, 40);
      if (ids.has(id)) id = uid();
      ids.add(id);
      const mode = a.mode === 'day' ? 'day' : 'week';
      out.activities.push({
        id,
        name: String(a.name || 'Untitled').slice(0, 60),
        hue: int(a.hue, 0, 360, HUES[out.activities.length % HUES.length][0]),
        mode,
        mins: Math.max(SNAP, snap(int(a.mins, SNAP, mode === 'day' ? 1440 : 10080, 60))),
        days: int(a.days, 1, 7, 5),
      });
    }
    for (const b of Array.isArray(d.blocks) ? d.blocks : []) {
      if (!b || typeof b !== 'object' || !ids.has(String(b.act))) continue;
      const dur = Math.max(SNAP, snap(int(b.dur, SNAP, 1440, 60)));
      out.blocks.push({
        id: String(b.id || uid()).slice(0, 40),
        act: String(b.act),
        day: int(b.day, 0, 6, 0),
        start: clamp(snap(int(b.start, 0, 1440, 540)), 0, 1440 - dur),
        dur,
      });
    }
    out.dayStart = int(d.dayStart, 0, 12, 7);
    out.dayEnd = int(d.dayEnd, 13, 24, 22);
    out.example = d.example === true;
    return out;
  }
  const serialize = () => ({
    v: 1,
    activities: S.activities.map((a) => ({ id: a.id, name: a.name, hue: a.hue, mode: a.mode, mins: a.mins, days: a.days })),
    blocks: S.blocks.map((b) => ({ id: b.id, act: b.act, day: b.day, start: b.start, dur: b.dur })),
    dayStart: S.dayStart,
    dayEnd: S.dayEnd,
    example: S.example,
  });

  const actById = (id) => S.activities.find((a) => a.id === id);
  const blockById = (id) => S.blocks.find((b) => b.id === id);
  const target = (a) => (a.mode === 'day' ? a.mins * a.days : a.mins);
  function placedTotals() {
    const m = new Map();
    for (const b of S.blocks) m.set(b.act, (m.get(b.act) || 0) + b.dur);
    return m;
  }
  function range() {
    let rs = S.dayStart, re = S.dayEnd;
    for (const b of S.blocks) {
      rs = Math.min(rs, Math.floor(b.start / 60));
      re = Math.max(re, Math.ceil((b.start + b.dur) / 60));
    }
    return [rs, re];
  }
  function defaultDur(a) {
    const left = target(a) - (placedTotals().get(a.id) || 0);
    let d = a.mode === 'day' ? a.mins : 90;   // 90 min: one lecture slot
    if (left > 0) d = Math.min(d, left);
    return clamp(d, SNAP, (calRE - calRS) * 60);
  }

  // ---------- formatting ----------
  function fmt(m) {
    m = Math.round(m);
    const h = Math.floor(m / 60), r = m % 60;
    if (!h) return r + ' min';
    return r ? h + ' h ' + r + ' min' : h + ' h';
  }
  function fmtShort(m) {
    const h = Math.floor(m / 60), r = m % 60;
    if (!h) return r + 'm';
    return r ? h + 'h' + String(r).padStart(2, '0') : h + 'h';
  }
  const clock = (m) => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');

  // ---------- persistence ----------
  let docRef = null, dirty = false, saving = false, lastStamp = null, saveTimer = 0, seq = 0;
  const clientId = uid();

  function loadLocal() {
    try { const raw = localStorage.getItem(LS_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
  }
  function saveLocal(pending) {
    try { localStorage.setItem(LS_KEY, JSON.stringify({ state: serialize(), pending: !!pending })); } catch (e) { /* storage unavailable */ }
  }
  const STATUS = {
    loading: 'Loading your week…',
    local: 'Saved in this browser only',
    saving: 'Saving…',
    synced: 'Saved to your account',
    failed: 'Could not reach your account. Changes are kept in this browser.',
  };
  function setStatus(kind) { $('#status').textContent = STATUS[kind] || ''; }
  function persist() {
    saveLocal(true);
    if (docRef) { dirty = true; scheduleSave(); }
  }
  function scheduleSave() { clearTimeout(saveTimer); saveTimer = setTimeout(flush, 700); }
  async function flush() {
    if (!docRef || saving || !dirty) return;
    if (drag) { scheduleSave(); return; }
    saving = true; dirty = false; setStatus('saving');
    const body = serialize();
    body.stamp = clientId + ':' + (++seq);
    lastStamp = body.stamp;
    let ok = false, fatal = false;
    try { await docRef.set(body); ok = true; } catch (e) {
      if (e && e.code === 'unavailable') {
        try { await wait(700 + Math.random() * 900); await docRef.set(body); ok = true; } catch (e2) { /* keep local */ }
      } else { fatal = true; }
    }
    saving = false;
    if (ok) {
      if (dirty) scheduleSave(); else { saveLocal(false); setStatus('synced'); }
    } else {
      dirty = true;
      if (fatal) { docRef = null; setStatus('local'); } else { setStatus('failed'); }
    }
  }
  function adopt(d) {
    S = sanitize(JSON.parse(JSON.stringify(d)));
    hist = []; selectedId = null; armedId = null; editingId = null;
    saveLocal(false);
    renderAll();
  }
  async function connect(pendingLocal) {
    const c = window.claude;
    if (!c || typeof c.use !== 'function') { setStatus('local'); return; }
    let db = null, user = null, id = null;
    try {
      [db, user] = await Promise.all([c.use('db'), c.use('user')]);
      if (db && user) id = await user.id();
    } catch (e) { /* treated as unavailable */ }
    if (!db || !id) { setStatus('local'); return; }
    try { docRef = db.doc('data/users/' + id + '/plan'); } catch (e) { docRef = null; setStatus('local'); return; }
    if (pendingLocal) dirty = true;
    let settled = false;
    docRef.onSnapshot((snap) => {
      if (snap.exists) {
        settled = true;
        const d = snap.data() || {};
        if (d.stamp && d.stamp === lastStamp) return;
        if (snap.metadata && snap.metadata.hasPendingWrites) return;
        if (dirty || saving || drag) return;
        adopt(d);
        setStatus('synced');
      } else if (!settled && !(snap.metadata && snap.metadata.fromCache)) {
        settled = true;
        if (S.activities.length) { dirty = true; scheduleSave(); } else if (!dirty) setStatus('synced');
      }
    }, () => { docRef = null; setStatus('local'); });
    if (dirty) scheduleSave();
  }

  // ---------- history ----------
  const snapshotJSON = () => JSON.stringify(serialize());
  function pushHistory(json) {
    hist.push(json || snapshotJSON());
    if (hist.length > 100) hist.shift();
    $('#undo').disabled = false;
  }
  function undo() {
    if (!hist.length) return;
    S = sanitize(JSON.parse(hist.pop()));
    selectedId = null; editingId = null;
    if (armedId && !actById(armedId)) armedId = null;
    hideToast();
    persist();
    renderAll();
  }

  // ---------- activity list ----------
  function formHTML(p, editing) {
    const hues = HUES.map(([h, label]) =>
      '<label class="hue" title="' + label + '"><input type="radio" name="' + p + '-hue" id="' + p + '-hue-' + h + '" value="' + h + '" aria-label="' + label + '"><span style="--h:' + h + '"></span></label>').join('');
    return '' +
      '<label class="fld"><span>Name</span><input id="' + p + '-name" type="text" maxlength="60" autocomplete="off" placeholder="e.g. Statistics lecture"></label>' +
      '<div class="fld-row">' +
        '<label class="fld"><span>Hours</span><input id="' + p + '-hours" type="number" min="0.25" max="168" step="0.25" inputmode="decimal" placeholder="4"></label>' +
        '<label class="fld"><span>Counted</span><select id="' + p + '-mode"><option value="week">per week</option><option value="day">per day</option></select></label>' +
        '<label class="fld" data-days hidden><span>Days</span><input id="' + p + '-days" type="number" min="1" max="7" step="1" value="5"></label>' +
      '</div>' +
      '<fieldset class="hues"><legend>Color</legend><div class="hue-list">' + hues + '</div></fieldset>' +
      '<p class="form-err" role="alert" hidden></p>' +
      '<div class="form-actions">' +
        (editing
          ? '<button type="submit" class="btn btn-primary">Save</button><button type="button" class="btn btn-quiet" data-do="cancel">Cancel</button><button type="button" class="btn btn-quiet btn-danger" data-do="delete">Delete</button>'
          : '<button type="submit" class="btn btn-primary">Add activity</button>') +
      '</div>';
  }
  function nextHue() {
    const used = new Set(S.activities.map((a) => a.hue));
    const free = HUES.find(([h]) => !used.has(h));
    return free ? free[0] : HUES[S.activities.length % HUES.length][0];
  }
  function fillForm(f, p, a) {
    $('#' + p + '-name', f).value = a ? a.name : '';
    $('#' + p + '-hours', f).value = a ? String(a.mins / 60) : '';
    $('#' + p + '-mode', f).value = a ? a.mode : 'week';
    $('#' + p + '-days', f).value = a ? String(a.days) : '5';
    $('[data-days]', f).hidden = !(a && a.mode === 'day');
    const hue = a ? a.hue : nextHue();
    const radio = $('#' + p + '-hue-' + hue, f) || $('input[type="radio"]', f);
    radio.checked = true;
    const err = $('.form-err', f); err.hidden = true; err.textContent = '';
  }
  function readForm(f, p) {
    const err = (msg) => { const e = $('.form-err', f); e.textContent = msg; e.hidden = false; return null; };
    const name = $('#' + p + '-name', f).value.trim();
    const hours = parseFloat(String($('#' + p + '-hours', f).value).replace(',', '.'));
    const mode = $('#' + p + '-mode', f).value === 'day' ? 'day' : 'week';
    const days = parseInt($('#' + p + '-days', f).value, 10);
    const hueEl = $('input[type="radio"]:checked', f);
    if (!name) return err('Give the activity a name.');
    if (!(hours > 0)) return err('Enter the hours it needs, for example 1.5.');
    if (mode === 'day' && hours > 24) return err('A day has 24 hours. Enter 24 or less.');
    if (mode === 'week' && hours > 168) return err('A week has 168 hours. Enter 168 or less.');
    if (mode === 'day' && !(days >= 1 && days <= 7)) return err('Enter how many days per week, from 1 to 7.');
    return {
      name: name.slice(0, 60),
      mins: Math.max(SNAP, snap(hours * 60)),
      mode,
      days: mode === 'day' ? days : 5,
      hue: hueEl ? Number(hueEl.value) : nextHue(),
    };
  }
  function wireForm(f, p) {
    $('#' + p + '-mode', f).addEventListener('change', (e) => { $('[data-days]', f).hidden = e.target.value !== 'day'; });
  }

  function renderActivities() {
    const list = $('#acts');
    list.textContent = '';
    $('#example-note').hidden = !S.example;
    $('#hint').hidden = !S.activities.length;
    $('#ledger-count').textContent = S.activities.length ? S.activities.length + (S.activities.length === 1 ? ' activity' : ' activities') : '';
    if (!S.activities.length) {
      const li = el('li', 'empty');
      li.textContent = 'No activities yet. Add a class, your job or the gym below, with the hours it needs. Then drag it onto the week.';
      list.appendChild(li);
    }
    for (const a of S.activities) {
      const li = el('li', 'act');
      li.dataset.id = a.id;
      li.style.setProperty('--h', a.hue);
      if (editingId === a.id) {
        const f = el('form', 'act-form');
        f.noValidate = true;
        f.innerHTML = formHTML('edit', true);
        fillForm(f, 'edit', a);
        wireForm(f, 'edit');
        li.appendChild(f);
      } else {
        li.innerHTML =
          '<button type="button" class="act-main" aria-pressed="false">' +
            '<span class="act-swatch" aria-hidden="true"></span>' +
            '<span class="act-text"><span class="act-name"></span><span class="act-sub"></span></span>' +
            '<span class="act-left"><span class="act-fig"></span><span class="act-cap"></span></span>' +
          '</button>' +
          '<div class="meter" role="img"><span class="meter-fill"></span></div>' +
          '<button type="button" class="btn btn-quiet act-edit">Edit</button>';
        $('.act-name', li).textContent = a.name;
        $('.act-sub', li).textContent = a.mode === 'day'
          ? fmt(a.mins) + ' per day, ' + a.days + (a.days === 1 ? ' day' : ' days')
          : fmt(a.mins) + ' per week';
        $('.act-edit', li).setAttribute('aria-label', 'Edit ' + a.name);
      }
      list.appendChild(li);
    }
    updateMeters();
    renderArm();
  }
  function updateMeters() {
    const placed = placedTotals();
    for (const li of $$('#acts .act')) {
      const a = actById(li.dataset.id);
      if (!a || editingId === a.id) continue;
      const t = target(a), p = placed.get(a.id) || 0, left = t - p;
      li.classList.toggle('is-done', left === 0);
      li.classList.toggle('is-over', left < 0);
      $('.act-fig', li).textContent = left > 0 ? fmt(left) : left === 0 ? 'All placed' : fmt(-left);
      $('.act-cap', li).textContent = left > 0 ? 'left to place' : left === 0 ? fmt(t) : 'over budget';
      $('.meter-fill', li).style.width = clamp((p / t) * 100, 0, 100) + '%';
      $('.meter', li).setAttribute('aria-label', fmt(p) + ' of ' + fmt(t) + ' placed');
    }
  }
  function renderArm() {
    const a = armedId ? actById(armedId) : null;
    if (!a) armedId = null;
    document.body.classList.toggle('is-armed', !!a);
    for (const li of $$('#acts .act')) {
      const b = $('.act-main', li);
      if (b) b.setAttribute('aria-pressed', String(!!a && li.dataset.id === a.id));
    }
    const bar = $('#armbar');
    bar.hidden = !a;
    if (a) {
      bar.style.setProperty('--h', a.hue);
      $('#arm-name').textContent = a.name;
      $('#arm-dur').textContent = fmt(defaultDur(a));
    } else {
      showPreview(null);
    }
  }

  // ---------- summary ----------
  function renderSummary() {
    const placed = placedTotals();
    let t = 0, p = 0, left = 0, over = 0;
    for (const a of S.activities) {
      const ta = target(a), pa = placed.get(a.id) || 0;
      t += ta; p += pa;
      if (pa < ta) left += ta - pa; else over += pa - ta;
    }
    const main = $('#sum-main');
    main.textContent = '';
    if (!S.activities.length) {
      main.textContent = 'Add activities on the left, then drag them onto the week.';
    } else {
      const fig = el('span', 'sum-fig'); fig.textContent = fmt(p);
      const tail = el('span', 'sum-left' + (left ? '' : over ? ' is-over' : ' is-done'));
      tail.textContent = left ? fmt(left) + ' left to place' : over ? 'everything placed, ' + fmt(over) + ' over budget' : 'everything is placed';
      main.append(fig, ' placed of ' + fmt(t) + ' · ', tail);
      if (left && over) main.append(' · ' + fmt(over) + ' over budget elsewhere');
    }
    $('#sum-fill').style.width = (t ? clamp((p / t) * 100, 0, 100) : 0) + '%';
    const perDay = [0, 0, 0, 0, 0, 0, 0];
    for (const b of S.blocks) perDay[b.day] += b.dur;
    $$('#cal .dh').forEach((h) => { $('.dh-sum', h).textContent = perDay[+h.dataset.day] ? fmtShort(perDay[+h.dataset.day]) : ''; });
    $('#clear').disabled = !S.blocks.length;
    $('#undo').disabled = !hist.length;
  }

  // ---------- calendar ----------
  const cal = $('#cal');
  const scroller = $('#scroller');

  function renderCal() {
    const r = range();
    calRS = r[0]; calRE = r[1];
    cal.textContent = '';
    cal.appendChild(el('div', 'corner'));
    const today = (new Date().getDay() + 6) % 7;
    DAYS.forEach((d, i) => {
      const h = el('div', 'dh' + (i === today ? ' is-today' : ''));
      h.dataset.day = i;
      const n = el('span', 'dh-name'); n.textContent = d;
      h.append(n, el('span', 'dh-sum'));
      cal.appendChild(h);
    });
    const height = (calRE - calRS) * HOUR + 'px';
    const g = el('div', 'gutter');
    g.style.height = height;
    for (let h = calRS; h < calRE; h++) {
      const s = el('span');
      s.textContent = clock(h * 60);
      s.style.top = (h - calRS) * HOUR + 'px';
      g.appendChild(s);
    }
    cal.appendChild(g);
    dayEls = [];
    for (let i = 0; i < 7; i++) {
      const d = el('div', 'day' + (i >= 5 ? ' is-weekend' : ''));
      d.dataset.day = i;
      d.style.height = height;
      d.appendChild(el('div', 'blocks'));
      cal.appendChild(d);
      dayEls.push(d);
    }
    preview = el('div', 'preview');
    preview.hidden = true;
  }
  function lanes(bs) {
    const out = new Map();
    let group = [], groupEnd = -1;
    const close = () => {
      const ends = [];
      for (const b of group) {
        let c = ends.findIndex((e) => e <= b.start);
        if (c < 0) { c = ends.length; ends.push(0); }
        ends[c] = b.start + b.dur;
        out.set(b.id, { col: c, cols: 1 });
      }
      for (const b of group) out.get(b.id).cols = ends.length;
      group = []; groupEnd = -1;
    };
    for (const b of bs) {
      if (group.length && b.start >= groupEnd) close();
      group.push(b);
      groupEnd = Math.max(groupEnd, b.start + b.dur);
    }
    if (group.length) close();
    return out;
  }
  function renderBlocks() {
    if (!drag) {
      const r = range();
      if (r[0] !== calRS || r[1] !== calRE || !dayEls.length) renderCal();
    }
    for (let d = 0; d < 7; d++) {
      const layer = $('.blocks', dayEls[d]);
      layer.textContent = '';
      const bs = S.blocks.filter((b) => b.day === d).sort((x, y) => x.start - y.start || y.dur - x.dur);
      const lay = lanes(bs);
      for (const b of bs) {
        const a = actById(b.act);
        if (!a) continue;
        const L = lay.get(b.id);
        const n = el('div', 'block'
          + (b.id === selectedId ? ' is-selected' : '')
          + (b.dur <= 30 ? ' is-short' : '')
          + (b.dur <= SNAP ? ' is-min' : '')
          + (drag && drag.moved && drag.id === b.id ? ' is-dragging' : ''));
        n.dataset.id = b.id;
        n.tabIndex = 0;
        n.setAttribute('role', 'group');
        const label = a.name + ', ' + DAYS_LONG[d] + ' ' + clock(b.start) + ' to ' + clock(b.start + b.dur) + ', ' + fmt(b.dur);
        n.setAttribute('aria-label', label);
        n.title = label;
        n.style.setProperty('--h', a.hue);
        n.style.top = ((b.start - calRS * 60) / 60) * HOUR + 1 + 'px';
        n.style.height = Math.max((b.dur / 60) * HOUR - 2, 10) + 'px';
        n.style.left = 'calc(' + (L.col / L.cols) * 100 + '% + 2px)';
        n.style.width = 'calc(' + 100 / L.cols + '% - 4px)';
        n.innerHTML = '<span class="rz rz-top" data-rz="top"></span><span class="blk-name"></span><span class="blk-time"></span>' +
          '<button type="button" class="blk-x" tabindex="-1" aria-label="Remove this tile">×</button><span class="rz rz-bot" data-rz="bot"></span>';
        $('.blk-name', n).textContent = b.dur <= 30 ? a.name + ' · ' + fmtShort(b.dur) : a.name;
        const durEl = el('span', 'blk-dur'); durEl.textContent = fmtShort(b.dur);
        const spanEl = el('span'); spanEl.textContent = clock(b.start) + '–' + clock(b.start + b.dur);
        $('.blk-time', n).append(durEl, spanEl);
        layer.appendChild(n);
      }
    }
    if (focusId) {
      const f = cal.querySelector('.block[data-id="' + focusId + '"]');
      focusId = null;
      if (f) f.focus({ preventScroll: true });
    }
  }
  function markSelection() {
    for (const n of $$('.block', cal)) n.classList.toggle('is-selected', n.dataset.id === selectedId);
  }
  function showPreview(t, dur, hue, text) {
    if (!preview) return;
    if (!t) { preview.hidden = true; return; }
    if (preview.parentNode !== dayEls[t.day]) dayEls[t.day].appendChild(preview);
    preview.style.setProperty('--h', hue);
    preview.style.top = ((t.start - calRS * 60) / 60) * HOUR + 1 + 'px';
    preview.style.height = Math.max((dur / 60) * HOUR - 2, 10) + 'px';
    preview.textContent = text || (clock(t.start) + '–' + clock(t.start + dur));
    preview.hidden = false;
  }

  const minutesAt = (y, rect) => calRS * 60 + ((y - rect.top) / HOUR) * 60;
  function dayAt(x, clampToEdge) {
    for (let i = 0; i < 7; i++) {
      const r = dayEls[i].getBoundingClientRect();
      if (x >= r.left && x < r.right) return i;
    }
    if (!clampToEdge) return -1;
    return x < dayEls[0].getBoundingClientRect().left ? 0 : 6;
  }
  function clampStart(st, dur) {
    return Math.max(calRS * 60, Math.min(st, calRE * 60 - dur));
  }
  function slotAt(x, y, dur) {
    const sr = scroller.getBoundingClientRect();
    if (x < sr.left || x > sr.right || y < sr.top || y > sr.bottom) return null;
    const d = dayAt(x, false);
    if (d < 0) return null;
    const rect = dayEls[d].getBoundingClientRect();
    if (y < rect.top || y > rect.bottom) return null;
    return { day: d, start: clampStart(floorSnap(minutesAt(y, rect)), dur) };
  }

  // ---------- changes ----------
  function afterBlocks() {
    renderBlocks();
    updateMeters();
    renderSummary();
    renderArm();
  }
  function renderAll() {
    $('#day-start').value = String(S.dayStart);
    $('#day-end').value = String(S.dayEnd);
    renderActivities();
    renderCal();
    renderBlocks();
    renderSummary();
  }
  function addBlock(actId, day, start, dur) {
    const a = actById(actId);
    if (!a) return;
    pushHistory();
    const b = { id: uid(), act: actId, day, start: clamp(start, 0, 1440 - dur), dur };
    S.blocks.push(b);
    selectedId = b.id;
    if (armedId === actId && target(a) - (placedTotals().get(actId) || 0) <= 0) armedId = null;
    persist();
    afterBlocks();
  }
  function removeBlock(id) {
    if (!blockById(id)) return;
    pushHistory();
    S.blocks = S.blocks.filter((b) => b.id !== id);
    if (selectedId === id) selectedId = null;
    persist();
    afterBlocks();
  }
  function firstFree(a, dur) {
    const has = new Set(S.blocks.filter((b) => b.act === a.id).map((b) => b.day));
    const all = [0, 1, 2, 3, 4, 5, 6];
    const order = a.mode === 'day' ? all.filter((d) => !has.has(d)).concat(all.filter((d) => has.has(d))) : all;
    for (const d of order) {
      const dayBlocks = S.blocks.filter((b) => b.day === d);
      for (let t = calRS * 60; t + dur <= calRE * 60; t += SNAP) {
        if (!dayBlocks.some((b) => b.start < t + dur && t < b.start + b.dur)) return { day: d, start: t };
      }
    }
    return null;
  }

  // ---------- toast ----------
  let toastTimer = 0;
  function toast(msg, canUndo) {
    $('#toast-text').textContent = msg;
    $('#toast-undo').hidden = !canUndo;
    $('#toast').hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, 7000);
  }
  function hideToast() { clearTimeout(toastTimer); $('#toast').hidden = true; }

  // ---------- dragging ----------
  function beginDrag(d, e) {
    drag = Object.assign({ sx: e.clientX, sy: e.clientY, lx: e.clientX, ly: e.clientY, pid: e.pointerId, moved: false, raf: 0 }, d);
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
  }
  function onMove(e) {
    if (!drag || e.pointerId !== drag.pid) return;
    drag.lx = e.clientX; drag.ly = e.clientY;
    if (!drag.moved) {
      if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 4) return;
      drag.moved = true;
      document.body.classList.add('is-dragging', drag.mode === 'move' ? 'drag-move' : 'drag-resize');
      if (drag.kind === 'new') {
        const a = actById(drag.act);
        const chip = $('#chip');
        chip.textContent = a.name + ' · ' + fmtShort(drag.dur);
        chip.style.setProperty('--h', a.hue);
        chip.hidden = false;
      }
    }
    if (!drag.raf) drag.raf = requestAnimationFrame(applyDrag);
  }
  function applyDrag() {
    if (!drag) return;
    drag.raf = 0;
    const x = drag.lx, y = drag.ly;
    const sr = scroller.getBoundingClientRect();
    if (x >= sr.left && x <= sr.right) {
      if (y > sr.bottom - 30) scroller.scrollTop += 14;
      else if (y < sr.top + 62) scroller.scrollTop -= 14;
    }
    if (drag.kind === 'new') {
      $('#chip').style.transform = 'translate(' + (x + 14) + 'px,' + (y + 12) + 'px)';
      const a = actById(drag.act);
      drag.target = slotAt(x, y, drag.dur);
      showPreview(drag.target, drag.dur, a.hue);
      return;
    }
    const b = blockById(drag.id);
    if (!b) return;
    const rect = dayEls[0].getBoundingClientRect();
    const lo = calRS * 60, hi = calRE * 60;
    const pm = minutesAt(y, rect);
    if (drag.mode === 'move') {
      b.day = dayAt(x, true);
      b.start = clampStart(snap(pm - drag.grab), b.dur);
    } else if (drag.mode === 'bot') {
      b.dur = clamp(snap(pm), b.start + SNAP, hi) - b.start;
    } else {
      const end = b.start + b.dur;
      b.start = clamp(snap(pm), lo, end - SNAP);
      b.dur = end - b.start;
    }
    renderBlocks();
    updateMeters();
    renderSummary();
  }
  function onUp(e) {
    if (!drag || e.pointerId !== drag.pid) return;
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onUp);
    if (drag.raf) { cancelAnimationFrame(drag.raf); drag.raf = 0; if (e.type === 'pointerup') applyDrag(); }
    const d = drag;
    drag = null;
    document.body.classList.remove('is-dragging', 'drag-move', 'drag-resize');
    if (d.kind === 'new') {
      $('#chip').hidden = true;
      showPreview(null);
      if (d.moved) {
        suppressUntil = performance.now() + 350;
        if (d.target && e.type === 'pointerup') addBlock(d.act, d.target.day, d.target.start, d.dur);
      }
      return;
    }
    if (!d.moved) return;
    suppressUntil = performance.now() + 350;
    if (e.type === 'pointercancel') {
      S = sanitize(JSON.parse(d.before));
    } else if (snapshotJSON() !== d.before) {
      pushHistory(d.before);
      persist();
    }
    focusId = d.id;
    afterBlocks();
  }

  // ---------- events: activity list ----------
  const acts = $('#acts');
  acts.addEventListener('pointerdown', (e) => {
    const main = e.target.closest('.act-main');
    if (!main || e.pointerType === 'touch' || e.button !== 0) return;
    const a = actById(main.closest('.act').dataset.id);
    if (!a) return;
    beginDrag({ kind: 'new', mode: 'move', act: a.id, dur: defaultDur(a), target: null }, e);
  });
  acts.addEventListener('click', (e) => {
    const li = e.target.closest('.act');
    if (!li) return;
    const id = li.dataset.id;
    if (e.target.closest('.act-main')) {
      if (performance.now() < suppressUntil) return;
      armedId = armedId === id ? null : id;
      renderArm();
      return;
    }
    if (e.target.closest('.act-edit')) {
      editingId = id;
      if (armedId === id) armedId = null;
      renderActivities();
      const n = $('#edit-name');
      if (n) n.focus();
      return;
    }
    const act = e.target.closest('[data-do]');
    if (!act) return;
    if (act.dataset.do === 'cancel') { editingId = null; renderActivities(); return; }
    if (act.dataset.do === 'delete') {
      const a = actById(id);
      const n = S.blocks.filter((b) => b.act === id).length;
      pushHistory();
      S.activities = S.activities.filter((x) => x.id !== id);
      S.blocks = S.blocks.filter((b) => b.act !== id);
      editingId = null; selectedId = null;
      if (armedId === id) armedId = null;
      persist();
      renderAll();
      toast('Deleted ' + a.name + (n ? ' and its ' + n + (n === 1 ? ' tile' : ' tiles') : '') + '.', true);
    }
  });
  acts.addEventListener('submit', (e) => {
    e.preventDefault();
    const a = actById(editingId);
    if (!a) return;
    const v = readForm(e.target, 'edit');
    if (!v) return;
    pushHistory();
    Object.assign(a, v);
    editingId = null;
    persist();
    renderAll();
  });
  acts.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && editingId) { e.stopPropagation(); editingId = null; renderActivities(); }
  });

  const addForm = el('form', 'act-form');
  addForm.id = 'add-form';
  addForm.noValidate = true;
  addForm.innerHTML = formHTML('add', false);
  $('#add-slot').appendChild(addForm);
  wireForm(addForm, 'add');
  addForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const v = readForm(addForm, 'add');
    if (!v) return;
    pushHistory();
    S.activities.push(Object.assign({ id: uid() }, v));
    persist();
    renderActivities();
    renderSummary();
    fillForm(addForm, 'add', null);
    $('#add-name').focus();
  });

  $('#ex-clear').addEventListener('click', () => {
    pushHistory();
    S.activities = []; S.blocks = []; S.example = false;
    selectedId = null; armedId = null; editingId = null;
    persist();
    renderAll();
    toast('Example week removed.', true);
    $('#add-name').focus();
  });
  $('#ex-keep').addEventListener('click', () => {
    S.example = false;
    persist();
    $('#example-note').hidden = true;
  });

  // ---------- events: calendar ----------
  cal.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const n = e.target.closest('.block');
    if (!n || e.target.closest('.blk-x')) return;
    const b = blockById(n.dataset.id);
    if (!b) return;
    if (e.pointerType === 'touch' && selectedId !== b.id) return;   // first tap selects, second drags
    const rz = e.target.closest('.rz');
    selectedId = b.id;
    markSelection();
    const pm = minutesAt(e.clientY, dayEls[b.day].getBoundingClientRect());
    beginDrag({ kind: 'block', id: b.id, mode: rz ? rz.dataset.rz : 'move', grab: pm - b.start, before: snapshotJSON() }, e);
  });
  cal.addEventListener('click', (e) => {
    if (performance.now() < suppressUntil) return;
    const x = e.target.closest('.blk-x');
    if (x) { removeBlock(x.closest('.block').dataset.id); return; }
    const n = e.target.closest('.block');
    if (n) { selectedId = n.dataset.id; markSelection(); return; }
    const dayEl = e.target.closest('.day');
    if (!dayEl) return;
    if (armedId) {
      const a = actById(armedId);
      const dur = defaultDur(a);
      const st = clampStart(floorSnap(minutesAt(e.clientY, dayEl.getBoundingClientRect())), dur);
      addBlock(a.id, +dayEl.dataset.day, st, dur);
    } else if (selectedId) {
      selectedId = null;
      markSelection();
    }
  });
  cal.addEventListener('pointermove', (e) => {
    if (!armedId || drag || e.pointerType !== 'mouse') return;
    const a = actById(armedId);
    if (!a || e.target.closest('.block')) { showPreview(null); return; }
    const dur = defaultDur(a);
    showPreview(slotAt(e.clientX, e.clientY, dur), dur, a.hue);
  });
  cal.addEventListener('pointerleave', () => { if (!drag) showPreview(null); });
  cal.addEventListener('focusin', (e) => {
    const n = e.target.closest('.block');
    if (n && selectedId !== n.dataset.id) { selectedId = n.dataset.id; markSelection(); }
  });
  cal.addEventListener('keydown', (e) => {
    const n = e.target.closest('.block');
    if (!n || drag) return;
    const b = blockById(n.dataset.id);
    if (!b) return;
    const lo = calRS * 60, hi = calRE * 60;
    const before = snapshotJSON();
    if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); removeBlock(b.id); return; }
    if (e.key === 'Escape') { selectedId = null; markSelection(); n.blur(); return; }
    if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
      const step = e.key === 'ArrowUp' ? -SNAP : SNAP;
      if (e.shiftKey) b.dur = clamp(b.dur + step, SNAP, hi - b.start);
      else b.start = Math.max(lo, Math.min(b.start + step, hi - b.dur));
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      b.day = clamp(b.day + (e.key === 'ArrowLeft' ? -1 : 1), 0, 6);
    } else return;
    e.preventDefault();
    if (snapshotJSON() === before) return;
    pushHistory(before);
    persist();
    focusId = b.id;
    afterBlocks();
  });

  // ---------- events: toolbar and dock ----------
  const startSel = $('#day-start'), endSel = $('#day-end');
  for (let h = 0; h <= 12; h++) startSel.add(new Option(clock(h * 60), String(h)));
  for (let h = 13; h <= 24; h++) endSel.add(new Option(clock(h * 60), String(h)));
  const onRange = () => {
    S.dayStart = int(startSel.value, 0, 12, 7);
    S.dayEnd = int(endSel.value, 13, 24, 22);
    persist();
    renderCal();
    renderBlocks();
    renderSummary();
  };
  startSel.addEventListener('change', onRange);
  endSel.addEventListener('change', onRange);

  $('#undo').addEventListener('click', undo);
  $('#toast-undo').addEventListener('click', undo);
  $('#clear').addEventListener('click', () => {
    const n = S.blocks.length;
    if (!n) return;
    pushHistory();
    S.blocks = [];
    selectedId = null;
    persist();
    afterBlocks();
    toast('Removed ' + n + (n === 1 ? ' tile' : ' tiles') + ' from the week.', true);
  });
  $('#arm-done').addEventListener('click', () => { armedId = null; renderArm(); });
  $('#arm-free').addEventListener('click', () => {
    const a = actById(armedId);
    if (!a) return;
    const dur = defaultDur(a);
    const slot = firstFree(a, dur);
    if (!slot) { toast('No free slot of ' + fmt(dur) + ' in the hours shown.', false); return; }
    addBlock(a.id, slot.day, slot.start, dur);
  });
  document.addEventListener('keydown', (e) => {
    const typing = /^(INPUT|SELECT|TEXTAREA)$/.test((e.target && e.target.tagName) || '');
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'z' && !typing) { e.preventDefault(); undo(); return; }
    if (e.key === 'Escape' && armedId) { armedId = null; renderArm(); }
  });

  // ---------- boot ----------
  function start() {
    document.documentElement.style.setProperty('--hour', HOUR + 'px');
    const local = loadLocal();
    if (local && local.state) S = sanitize(local.state);
    fillForm(addForm, 'add', null);
    renderAll();
    setStatus(window.claude && !S.activities.length ? 'loading' : 'local');
    connect(!!(local && local.pending));
  }
  start();
})();
</script>
