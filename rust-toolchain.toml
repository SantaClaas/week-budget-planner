# The Rust toolchain every build uses, locally and in CI (see Layout in docs/guidelines/rust.md).
# A new release is taken by changing this line, a week after it's out, like any dependency.
[toolchain]
channel = "1.100.0"
components = ["rustfmt", "clippy"]
# The transport's WebAssembly module (crates/transport).
targets = ["wasm32-unknown-unknown"]
profile = "minimal"
